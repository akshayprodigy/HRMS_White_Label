# Apply for a leave in the far future, see it in "My requests", then cancel it so the flow is re-runnable.
# Needs a seeded employee with a paid leave balance on at least one leave type (the first chip is used).
appId: com.innocore.hrms.dev
---
- runFlow: _login.yaml
- evalScript: ${output.leaveDate = new Date(Date.now() + (60 + Math.floor(Math.random() * 300)) * 86400000).toISOString().slice(0, 10)}
- tapOn:
    id: tab-leave
- tapOn:
    id: apply-leave
- assertVisible:
    id: apply-form
# Validation: an empty submit shows field errors and creates nothing.
# The submit button is below the fold on tall forms / small screens.
- scrollUntilVisible:
    element:
      id: submit-leave
- tapOn:
    id: submit-leave
- assertVisible: Enter a reason.
# The form scrolls so the first error sits under the status bar (not 100% visible); scroll back up to it.
- scrollUntilVisible:
    element: Choose a leave type.
    direction: UP
- assertVisible: Choose a leave type.
# Emergency toggle reveals the helper text; turn it back off.
- scrollUntilVisible:
    element:
      id: toggle-emergency
- tapOn:
    id: toggle-emergency
- assertVisible:
    id: emergency-help
- tapOn:
    id: toggle-emergency
# Fill and submit.
- scrollUntilVisible:
    element:
      id: type-.*
    direction: UP
- tapOn:
    id: type-.*
    index: 0
- tapOn:
    id: input-start
# Toggling emergency on/off leaves today's date prefilled; clear it before typing.
- eraseText: 12
- inputText: ${output.leaveDate}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: input-end
- tapOn:
    id: input-end
- eraseText: 12
- inputText: ${output.leaveDate}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: input-reason
- tapOn:
    id: input-reason
- inputText: Maestro e2e leave
- hideKeyboard
# The submit button is below the fold on tall forms / small screens.
- scrollUntilVisible:
    element:
      id: submit-leave
- tapOn:
    id: submit-leave
# After submitting, the view is scrolled down to the list: check the request there, then scroll back up for the notice.
- assertVisible: Maestro e2e leave
- scrollUntilVisible:
    element:
      id: leave-notice
    direction: UP
- assertVisible:
    id: leave-notice
# Cancel the request again (confirm step).
- scrollUntilVisible:
    element:
      id: cancel-.*
- tapOn:
    id: cancel-.*
    index: 0
- tapOn:
    id: cancel-confirm-.*
- assertVisible: Cancelled
