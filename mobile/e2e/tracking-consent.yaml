# Consent screen for shift location sharing (dev tenant, backend on :8005 -- see memory dev-stack-local).
# Precondition: live location is OFF by default, so HR must enable it for the employee's role first. As an HR admin:
#   TOKEN=$(curl -s -X POST localhost:8005/api/v1/auth/login -d 'username=<hr-admin-email>&password=<pw>' | jq -r .access_token)
#   curl -s -H "Authorization: Bearer $TOKEN" localhost:8005/api/v1/tracking/policies          # find the employee role's role_id
#   curl -s -X PUT -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
#     -d '{"enabled": true, "interval_seconds": 60, "distance_filter_m": 10}' localhost:8005/api/v1/tracking/policies/<role_id>
# Without the policy this flow still passes through the "Not turned on for your role" branch (asserted below as the
# alternative) but cannot exercise consent. Run once with a fresh state (consent not yet given).
# Second half (automated): needs the employee to have a rostered shift whose window contains "now" (shift +/- 30 min UTC).
# It sets the simulator location, waits for the foreground watcher / task to upload, then runs field-now-ping.js, which
# logs in as HR over the API and asserts the employee row has a ping. Run with:
#   maestro test -e HR_EMAIL=<hr> -e HR_PASSWORD=<pw> [-e API_BASE=http://localhost:8005/api/v1] [-e EMPLOYEE_EMAIL=employee@gmail.com] e2e/tracking-consent.yaml
appId: com.innocore.hrms.dev
---
- runFlow: _login.yaml
- tapOn:
    id: tab-more
- tapOn:
    id: open-location-sharing
- extendedWaitUntil:
    visible: .*(I agree|Not turned on for your role|Consented).*
    timeout: 15000
- takeScreenshot: artifacts/tracking-consent
# Only when the role policy is enabled and consent is not yet given:
- runFlow:
    when:
      visible: I agree
    commands:
      - assertVisible: .*Only during your rostered shifts.*
      - assertVisible: .*30 days.*
      - assertVisible: .*revoke consent at any time.*
      - tapOn:
          id: tracking-agree
      # The OS location prompt follows; allow while using / always as the simulator offers.
      - tapOn:
          text: .*(Allow While Using App|While using the app|Allow).*
          optional: true
      - extendedWaitUntil:
          visible: .*Consented.*
          timeout: 15000
      - takeScreenshot: artifacts/tracking-consented
# --- simulator location ping appears in field-now (API check) ---
- setLocation:
    latitude: 12.9716
    longitude: 77.5946
# Updates are distance/time filtered (policy); give the watcher time to deliver + upload (policy interval 60 s in the setup above).
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible: .*Consented.*
    timeout: 90000
- repeat:
    times: 3
    commands:
      - setLocation:
          latitude: 12.9720
          longitude: 77.5950
      - waitForAnimationToEnd:
          timeout: 20000
- runScript: field-now-ping.js
