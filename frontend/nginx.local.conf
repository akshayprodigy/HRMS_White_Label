# Per-IP rate limit for biometric device traffic (this file is included in http{}).
limit_req_zone $binary_remote_addr zone=iclock:10m rate=120r/m;

server {
    listen 80;
    server_name _;

    # Cache hashed build assets aggressively; never cache HTML so redeploys take effect immediately.
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # In local prod-like mode, proxy API to the backend service.
    location /api {
        resolver 127.0.0.11 valid=30s;
        set $upstream backend;
        proxy_pass http://$upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_request_buffering off;
    }

    # Punch import: 5 MB file cap enforced by the API; 6m leaves multipart overhead.
    location ^~ /api/v1/biometric/import {
        resolver 127.0.0.11 valid=30s;
        set $upstream backend;
        proxy_pass http://$upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_request_buffering off;
        client_max_body_size 6m;
    }

    # ADMS / iClock biometric devices push here (plain HTTP/1.1, no auth).
    location = /iclock {
        resolver 127.0.0.11 valid=30s;
        set $upstream backend;
        proxy_pass http://$upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # OVERWRITE (never append) so a client cannot forge X-Forwarded-For.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 2m;
        limit_req zone=iclock burst=60 nodelay;
        proxy_read_timeout 30s;
    }

    location ^~ /iclock/ {
        resolver 127.0.0.11 valid=30s;
        set $upstream backend;
        proxy_pass http://$upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # OVERWRITE (never append) so a client cannot forge X-Forwarded-For.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 2m;
        limit_req zone=iclock burst=60 nodelay;
        proxy_read_timeout 30s;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
